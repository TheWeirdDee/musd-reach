[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# solc versions are auto-detected: src pins 0.8.28, the vendored Mezo vault pins 0.8.33.
# Mezo's deployed MUSDSavingsRate is compiled for london; target the same EVM
# so no PUSH0/MCOPY/TSTORE opcodes reach a chain that may not support them.
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../../evidence" }, { access = "read-write", path = "../../deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # The vendored, explorer-verified Mezo vault source carries its own OZ 4.x tree.
  "test/vendor/mezo-savings/:@openzeppelin/=test/vendor/mezo-savings/@openzeppelin/",
]

# Base Sepolia market layer (oracle + Morpho market + Vault V2). Morpho's deployed contracts use
# Cancun opcodes, so simulations against them need a Cancun EVM. Separate output keeps the
# london artifacts that the v2 bytecode verifier compares against untouched.
[profile.markets]
evm_version = "cancun"
out = "out-markets"
cache_path = "cache-markets"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
base_sepolia = "https://sepolia.base.org"

# The built-in linter cannot resolve the vendored Mezo vault's own OpenZeppelin-upgradeable
# remapping, so it would fail every `forge build`; tests and Slither cover the sources instead.
[lint]
lint_on_build = false

[fmt]
line_length = 100
