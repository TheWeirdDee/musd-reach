packages:
  - "packages/sdk"
  - "packages/verifier"
  - "packages/protocol-registry"
  - "apps/*"
  - "scripts"
allowBuilds:
  esbuild: true
  # Optional native accelerators from wallet deps; JS fallbacks are used.
  bufferutil: false
  keccak: false
  utf-8-validate: false
  sharp: false
  unrs-resolver: false
overrides:
  ansi-regex@5.0.0: 5.0.1
  elliptic@6.6.1: 6.6.2
  ws@^8: 8.21.0
  fast-uri@^3: 3.1.9
  fast-uri@^4: 4.2.3
